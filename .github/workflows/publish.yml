name: Publish library
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install document preview tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils libreoffice-writer fonts-crosextra-carlito fonts-crosextra-caladea
      - uses: actions/cache@v4
        with:
          path: site/assets/thumbnails
          key: exam-first-pages-v1-${{ github.sha }}
          restore-keys: exam-first-pages-v1-
      - name: Test catalogue builder
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Index uploaded resources
        run: python3 scripts/build_catalog.py
      - name: Generate first-page document previews
        run: python3 scripts/build_thumbnails.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4

